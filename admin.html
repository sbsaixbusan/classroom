<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>관리자 | SBS아카데미AIX학원 부산점</title><style>:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#19314b;background:#f5f7fc}*{box-sizing:border-box}main{max-width:970px;margin:30px auto;padding:18px}.panel{background:white;border:1px solid #e1e8f2;padding:22px;border-radius:16px;margin-bottom:15px}input,textarea{width:100%;padding:12px;border:1px solid #cad6e4;border-radius:8px;margin:7px 0 13px}button{border:0;border-radius:8px;background:#1554b7;color:white;padding:11px 15px;cursor:pointer;margin:3px}button.alt{background:#e8eff8;color:#23405d}button.danger{background:#b43a3a}#msg{color:#3d6278}#err{color:#bd2a2a}table{border-collapse:collapse;width:100%}td,th{text-align:left;border-bottom:1px solid #e4e9f0;padding:12px}small{color:#697b8f}a{color:#2159ad} .hide{display:none}</style></head><body><main><p><a href="index.html">← 강의 목록으로</a></p><h1>온라인 강의실 관리자</h1><p><small>관리자 인증 후 교육과정을 등록·수정할 수 있습니다. 이 단계에서는 학생 영상 재생 및 비밀번호 자동 전환을 아직 제공하지 않습니다.</small></p><div id="msg" role="status"></div><div id="err" role="alert"></div><section class="panel" id="loginPanel"><h2>관리자 로그인</h2><label>이메일<input id="email" type="email" autocomplete="username" required></label><label>비밀번호<input id="password" type="password" autocomplete="current-password" required></label><button id="login">로그인</button></section><section id="dashboard" class="hide"><div class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><h2>교육과정 관리</h2><button class="alt" id="logout">로그아웃</button></div><label>과목명<input id="title" maxlength="150" placeholder="예: 포토샵"></label><label>설명<textarea id="description" maxlength="500" rows="2" placeholder="교육과정 소개"></textarea></label><button id="save">과목 추가</button><button class="alt" id="cancel">수정 취소</button></div><div class="panel"><h2>등록된 과목</h2><div id="list">불러오는 중...</div></div></section></main><script src="config.js"></script><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const $=id=>document.getElementById(id),c=window.AIX_CONFIG;
if(!c||c.SUPABASE_URL.includes('YOUR_PROJECT_REF')||c.SUPABASE_PUBLISHABLE_KEY.includes('REPLACE_ME')){$('err').textContent='config.js 파일에 Supabase 연결 정보를 먼저 입력해 주세요.';throw Error('Missing config')}
const db=createClient(c.SUPABASE_URL,c.SUPABASE_PUBLISHABLE_KEY);let editing=null,items=[];
const notice=(v,bad=false)=>{(bad?$('err'):$('msg')).textContent=v; if(!bad)$('err').textContent=''};
async function sessionCheck(){const {data:{session}}=await db.auth.getSession();$('loginPanel').classList.toggle('hide',!!session);$('dashboard').classList.toggle('hide',!session);if(session)await load()}
async function load(){const {data,error}=await db.from('courses').select('id,title,description').order('title');if(error){notice('과목 조회 실패: '+error.message,true);return}items=data||[];const root=$('list');root.replaceChildren();if(!items.length){root.textContent='등록된 과목이 없습니다. 위에서 첫 과목을 추가하세요.';return}const table=document.createElement('table');const head=document.createElement('tr');for(const t of ['과목명','설명','관리']){const th=document.createElement('th');th.textContent=t;head.append(th)}table.append(head);for(const x of items){const tr=document.createElement('tr');for(const value of [x.title,x.description]){const td=document.createElement('td');td.textContent=value;tr.append(td)}const td=document.createElement('td');const edit=document.createElement('button');edit.textContent='수정';edit.className='alt';edit.onclick=()=>{editing=x.id;$('title').value=x.title;$('description').value=x.description;$('save').textContent='변경 저장';window.scrollTo(0,0)};td.append(edit);tr.append(td);table.append(tr)}root.append(table)}
$('login').onclick=async()=>{notice('로그인 확인 중...');const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){notice('로그인 실패: '+error.message,true);return} $('password').value='';notice('로그인했습니다.');await sessionCheck()};
$('save').onclick=async()=>{const title=$('title').value.trim(),description=$('description').value.trim();if(!title){notice('과목명을 입력해 주세요.',true);return}const result=editing?await db.from('courses').update({title,description,updated_at:new Date().toISOString()}).eq('id',editing):await db.from('courses').insert({title,description});if(result.error){notice('저장 실패: '+result.error.message,true);return}editing=null;$('title').value='';$('description').value='';$('save').textContent='과목 추가';notice('저장했습니다.');await load()};
$('cancel').onclick=()=>{editing=null;$('title').value='';$('description').value='';$('save').textContent='과목 추가'};
$('logout').onclick=async()=>{await db.auth.signOut();await sessionCheck();notice('로그아웃했습니다.')};
await sessionCheck();
</script></body></html>
