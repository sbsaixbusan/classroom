<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>온라인 강의실 | SBS아카데미AIX학원 부산점</title>
<style>
:root{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#1c2e48;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}header,main,footer{max-width:1160px;margin:auto;padding-left:22px;padding-right:22px}header{padding-top:19px;padding-bottom:19px;display:flex;align-items:center;gap:13px}.logo{display:grid;place-items:center;width:47px;height:47px;border-radius:12px;background:#1552aa;color:white;font-size:19px;letter-spacing:.02em}.site-title{font-size:16px;font-weight:800;letter-spacing:-.03em}.eyebrow{color:#7790ac;font-size:11px;letter-spacing:.13em;margin-top:3px}main{padding-top:4px}.hero{height:235px;border-radius:17px;overflow:hidden;border:1px solid #e2eaf5;background:#e8f4ff}.hero img{display:block;width:100%;height:100%;object-fit:fill}.card{background:#fff;padding:28px;border:1px solid #e4eaf2;border-radius:16px;margin:24px 0;box-shadow:0 8px 34px rgba(23,51,90,.035)}.section-top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap}.section-top h1{margin:0 0 7px;font-size:24px;letter-spacing:-.05em}.muted{color:#718099;line-height:1.6;font-size:14px;margin:0}.search{display:flex;align-items:center;gap:10px;background:#f8faff;border:1px solid #dde6f2;padding:0 14px;border-radius:10px;min-width:230px;height:43px}.search input{border:0;outline:0;background:transparent;min-width:0;width:100%;font-size:14px;color:#1e3554}.search input::placeholder{color:#9aa6b6}.course-count{font-size:12px;color:#72829a;margin:20px 0 13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.course{position:relative;min-height:132px;border-radius:13px;border:1px solid #e1e8f2;background:#fff;cursor:pointer;display:flex;align-items:flex-start;gap:14px;text-align:left;padding:20px;transition:box-shadow .18s,border-color .18s,transform .18s}.course:hover,.course:focus-visible{border-color:#387cdd;box-shadow:0 9px 24px rgba(32,85,164,.12);transform:translateY(-2px);outline:none}.course .mark{display:flex;align-items:center;justify-content:center;width:43px;height:43px;flex:0 0 43px;border-radius:12px;background:#ecf3ff;color:#1b59b6;font-size:20px}.course-body{display:flex;flex-direction:column;gap:8px;min-width:0}.course-name{font-size:19px;font-weight:800;color:#19304d;line-height:1.35;word-break:keep-all}.course-desc{color:#76879e;font-size:12px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}.course-enter{font-size:12px;color:#185ac2;font-weight:700;margin-top:auto}.error{color:#bd2a2a!important}#status:empty{display:none}footer{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:#8793a6;margin-top:45px;padding-bottom:32px}footer a{color:#8491a4;text-decoration:none;font-size:11px}footer a:hover{text-decoration:underline}#modal{display:none;position:fixed;inset:0;background:rgba(9,25,49,.62);align-items:center;justify-content:center;padding:20px;z-index:3}#modal.open{display:flex}.dialog{background:white;border-radius:19px;max-width:450px;width:100%;padding:30px;box-shadow:0 16px 40px #0b1e3c30}.dialog h2{font-size:22px;margin:0 0 12px;letter-spacing:-.04em}.dialog p{line-height:1.75}.dialog button{padding:12px 20px;border:0;border-radius:9px;background:#1856bb;color:white;cursor:pointer;margin-top:22px}.dialog button:hover{background:#0f428f}
@media(max-width:650px){header,main,footer{padding-left:16px;padding-right:16px}.site-title{font-size:14px}.hero{height:160px;border-radius:12px}.card{padding:19px;margin-top:17px}.section-top h1{font-size:21px}.search{width:100%;min-width:0}.grid{grid-template-columns:1fr}.course{min-height:110px;padding:17px}}
</style></head>
<body>
<header><strong class="logo">AIX</strong><div><div class="site-title">SBS아카데미AIX학원 부산점</div><div class="eyebrow">ONLINE LEARNING CENTER</div></div></header>
<main><section class="hero" aria-label="수업의 연장선, 언제 어디서나 이어지는 배움"><img src="assets/learning-banner.webp" alt="수업의 연장선, 언제 어디서나 이어지는 배움 — 교실을 넘어 배움은 일상 속에서 계속됩니다"></section>
<section class="card" aria-labelledby="courseTitle"><div class="section-top"><div><h1 id="courseTitle">전체 교육과정</h1><p class="muted">수강 중인 과정을 찾아 선택해 주세요.</p></div><label class="search"><span aria-hidden="true">⌕</span><input id="courseSearch" type="search" placeholder="과목명 검색" aria-label="교육과정 검색"></label></div>
<p class="course-count" id="status" role="status">강의 목록을 불러오고 있습니다.</p><div id="courses" class="grid"></div></section></main>
<footer><span>© SBS아카데미AIX학원 부산점</span><a href="admin.html">관리자</a></footer>
<div id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="dialog"><h2 id="modalTitle"></h2><p class="muted">해당 교육과정의 온라인 강의 시청 기능은 준비 중입니다. 수업 안내는 담당자에게 문의해 주세요.</p><button id="closeModal" type="button">확인</button></div></div>
<script src="config.js"></script>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const status=document.getElementById('status');
const grid=document.getElementById('courses');
const search=document.getElementById('courseSearch');
const modal=document.getElementById('modal');
const c=window.AIX_CONFIG;
let courses=[];
function render(query=''){
 grid.replaceChildren();
 const filtered=courses.filter(item=>(item.course_title+' '+(item.course_description||'')).toLocaleLowerCase().includes(query.trim().toLocaleLowerCase()));
 status.textContent=query?`검색 결과 ${filtered.length}개 교육과정`:`총 ${courses.length}개 교육과정`;
 if(!filtered.length){const p=document.createElement('p');p.className='muted';p.textContent='검색 결과가 없습니다.';grid.append(p);return;}
 for(const item of filtered){
  const btn=document.createElement('button');btn.type='button';btn.className='course';
  const mark=document.createElement('span');mark.className='mark';mark.textContent='▸';mark.setAttribute('aria-hidden','true');
  const body=document.createElement('span');body.className='course-body';
  const name=document.createElement('span');name.className='course-name';name.textContent=item.course_title;
  const desc=document.createElement('span');desc.className='course-desc';desc.textContent=item.course_description||'온라인 교육과정';
  const enter=document.createElement('span');enter.className='course-enter';enter.textContent='과정 살펴보기 →';
  body.append(name,desc,enter);btn.append(mark,body);
  btn.addEventListener('click',()=>{document.getElementById('modalTitle').textContent=item.course_title;modal.classList.add('open')});
  grid.append(btn);
 }
}
search.addEventListener('input',()=>{if(courses.length)render(search.value)});
if(!c||!c.SUPABASE_URL||!c.SUPABASE_PUBLISHABLE_KEY||c.SUPABASE_URL.includes('YOUR_PROJECT_REF')||c.SUPABASE_PUBLISHABLE_KEY.includes('REPLACE_ME')){
 status.classList.add('error');status.textContent='홈페이지 연결 설정이 아직 완료되지 않았습니다.';
}else{
 try{
  const db=createClient(c.SUPABASE_URL,c.SUPABASE_PUBLISHABLE_KEY);
  const {data,error}=await db.rpc('list_aix_courses');
  if(error){status.classList.add('error');status.textContent='목록 연결 오류: '+error.message}
  else if(!data?.length){status.textContent='현재 등록된 교육과정이 없습니다.'}
  else{courses=data;render()}
 }catch(e){status.classList.add('error');status.textContent='목록 연결 오류: '+(e?.message||'알 수 없는 오류')}
}
document.getElementById('closeModal').addEventListener('click',()=>modal.classList.remove('open'));
modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.remove('open')});
</script></body></html>
