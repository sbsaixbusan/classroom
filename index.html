<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>온라인 강의실 | SBS아카데미AIX학원 부산점</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#182b43;background:#f5f7fc}*{box-sizing:border-box}body{margin:0}header,main,footer{max-width:1120px;margin:auto;padding:20px}header{display:flex;align-items:center;gap:13px}strong.logo{display:inline-block;background:#1754b8;color:white;padding:14px;border-radius:12px;letter-spacing:1px}small, .muted{color:#6f8095}.hero{padding:38px;background:linear-gradient(120deg,#143c82,#2772ce);color:white;border-radius:20px}.hero p{color:#e2ecfd}.card{background:white;padding:22px;border:1px solid #e2e8f1;border-radius:16px;margin:24px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:15px}.course{background:#fff;border:1px solid #dae3ee;border-radius:13px;text-align:left;padding:22px;min-height:115px;cursor:pointer}.course:hover{border-color:#1754b8;box-shadow:0 7px 22px #163c7815;transform:translateY(-2px)}.course{transition:box-shadow .15s,transform .15s,border-color .15s}.course b{font-size:19px;color:#142b4b;line-height:1.45}.course small{display:block;line-height:1.55}.course b{display:block;margin:10px 0}.error{color:#bd2a2a}footer{display:flex;justify-content:space-between;font-size:12px;color:#8390a1;margin-top:65px}a{color:inherit}#modal{display:none;position:fixed;inset:0;background:#08162a99;align-items:center;justify-content:center;padding:20px}#modal.open{display:flex}.dialog{background:white;border-radius:16px;max-width:430px;width:100%;padding:25px}.dialog button{padding:11px 16px;border-radius:9px;background:#1654b8;color:white;border:0;cursor:pointer}.dialog button.secondary{background:#eaf0f7;color:#223854}
</style></head><body><header><strong class="logo">AIX</strong><div><b>SBS아카데미AIX학원 부산점</b><div><small>ONLINE LEARNING CENTER</small></div></div></header><main><section class="hero"><small style="color:#dbeaff">SBS ACADEMY AIX · BUSAN</small><h1>온라인 강의실</h1><p>수강 중인 교육과정을 선택해 주세요.</p></section><section class="card"><h2>전체 교육과정</h2><p class="muted">수강 중인 과정을 선택해 주세요. 강의 입장은 담당자의 안내에 따라 진행됩니다.</p><div id="status" role="status">강의 목록을 불러오고 있습니다.</div><div id="courses" class="grid"></div></section></main><footer><span>© SBS아카데미AIX학원 부산점</span><a href="admin.html">관리자</a></footer><div id="modal" role="dialog" aria-modal="true"><div class="dialog"><h3 id="modalTitle"></h3><p class="muted">과목별 비밀번호 인증 및 영상 시청은 서버 기능 연결 후 제공됩니다.</p><button class="secondary" id="closeModal">닫기</button></div></div><script src="config.js"></script><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const status=document.getElementById('status'), grid=document.getElementById('courses'); const c=window.AIX_CONFIG;
if(!c||c.SUPABASE_URL.includes('YOUR_PROJECT_REF')||c.SUPABASE_PUBLISHABLE_KEY.includes('REPLACE_ME')){status.textContent='홈페이지 연결 설정이 아직 완료되지 않았습니다.';}else{
 const db=createClient(c.SUPABASE_URL,c.SUPABASE_PUBLISHABLE_KEY);
 const {data,error}=await db.rpc('list_aix_courses');
 if(error){status.className='error';status.textContent='목록 연결 오류: '+error.message;} else if(!data?.length){status.textContent='현재 등록된 교육과정이 없습니다.';}else{status.textContent='총 '+data.length+'개 교육과정';for(const item of data){const btn=document.createElement('button');btn.className='course';const name=document.createElement('b');name.textContent=item.course_title;const desc=document.createElement('small');desc.textContent=item.course_description||'교육과정 자세히 보기';btn.append(name,desc);btn.addEventListener('click',()=>{document.getElementById('modalTitle').textContent=item.course_title;document.getElementById('modal').classList.add('open')});grid.append(btn)}}
}
document.getElementById('closeModal').onclick=()=>document.getElementById('modal').classList.remove('open');
</script></body></html>
