<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>온라인 강의실 | SBS아카데미AIX학원 부산점</title>
<style>
:root{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#1c2e48;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}header,main,footer{max-width:1160px;margin:auto;padding-left:22px;padding-right:22px}header{padding-top:19px;padding-bottom:19px;display:flex;align-items:center;gap:13px}.logo{display:grid;place-items:center;width:47px;height:47px;border-radius:12px;background:#1552aa;color:white;font-size:19px;letter-spacing:.02em}.site-title{font-size:16px;font-weight:800;letter-spacing:-.03em}.eyebrow{color:#7790ac;font-size:11px;letter-spacing:.13em;margin-top:3px}main{padding-top:4px}.hero{border-radius:13px;overflow:hidden;border:1px solid #e2eaf5;background:#e8f4ff}.hero picture,.hero img{display:block;width:100%}.hero img{height:auto;aspect-ratio:1077/176;object-fit:contain}.card{background:transparent;padding:26px 0;border:0;border-radius:0;margin:22px 0 28px;box-shadow:none}.section-top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap}.section-top h1{margin:0 0 7px;font-size:24px;letter-spacing:-.05em}.muted{color:#718099;line-height:1.6;font-size:14px;margin:0}.search{display:flex;align-items:center;gap:10px;background:#f8faff;border:1px solid #dde6f2;padding:0 14px;border-radius:10px;min-width:230px;height:43px}.search input{border:0;outline:0;background:transparent;min-width:0;width:100%;font-size:14px;color:#1e3554}.search input::placeholder{color:#9aa6b6} .course-count{font-size:12px;font-weight:650;color:#62748f;margin:16px 0 14px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.course{position:relative;min-width:0;min-height:145px;border-radius:16px;border:1px solid #dbe4ef;background:#fff;cursor:pointer;display:flex;align-items:flex-start;gap:13px;text-align:left;padding:21px 18px;transition:box-shadow .18s,border-color .18s,transform .18s;box-shadow:0 4px 14px rgba(23,51,90,.045)}.course:hover,.course:focus-visible{border-color:#2b6bd0;box-shadow:0 12px 24px rgba(26,79,158,.13);transform:translateY(-2px);outline:none}.course .mark{display:flex;align-items:center;justify-content:center;width:46px;height:46px;flex:0 0 46px;border-radius:14px;background:#eaf2ff;color:#2158a9}.course .mark svg{width:23px;height:23px}.course-body{display:flex;flex-direction:column;gap:7px;min-width:0;flex:1}.course-name{font-size:17px;font-weight:800;color:#182d4b;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere;letter-spacing:-.035em}.course-desc{color:#64748b;font-size:12px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}.course-enter{font-size:11px;color:#1c57b3;font-weight:700;margin-top:auto;padding-top:7px}.course-arrow{margin-left:auto;align-self:center;color:#8ba2c2;flex:0 0 auto;font-size:23px;line-height:1}.course:nth-child(6n+2) .mark{background:#e9f7f7;color:#087f91}.course:nth-child(6n+3) .mark{background:#f0edff;color:#6c59cb}.course:nth-child(6n+4) .mark{background:#fff3e8;color:#b46b23}.course:nth-child(6n+5) .mark{background:#edf8ed;color:#388453}.course:nth-child(6n+6) .mark{background:#edf2f9;color:#476889}.empty{grid-column:1/-1;background:#fff;border:1px dashed #cbd7e6;border-radius:14px;padding:32px;text-align:center;color:#718099;font-size:14px}.section-top h1{font-size:22px}.search{background:white}.course b{display:block}
.error{color:#bd2a2a!important}#status:empty{display:none}footer{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:#8793a6;margin-top:45px;padding-bottom:32px}footer a{color:#8491a4;text-decoration:none;font-size:11px}footer a:hover{text-decoration:underline}#modal{display:none;position:fixed;inset:0;background:rgba(9,25,49,.62);align-items:center;justify-content:center;padding:20px;z-index:3}#modal.open{display:flex}.dialog{background:white;border-radius:19px;max-width:450px;width:100%;padding:30px;box-shadow:0 16px 40px #0b1e3c30}.dialog h2{font-size:22px;margin:0 0 12px;letter-spacing:-.04em}.dialog p{line-height:1.75}.dialog button{padding:12px 20px;border:0;border-radius:9px;background:#1856bb;color:white;cursor:pointer;margin-top:22px}.dialog button:hover{background:#0f428f}
@media(min-width:651px) and (max-width:970px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){header,main,footer{padding-left:16px;padding-right:16px}.site-title{font-size:14px}.hero{border-radius:12px}.hero img{aspect-ratio:339/112}.card{padding:19px;margin-top:17px}.section-top h1{font-size:21px}.search{width:100%;min-width:0}.grid{grid-template-columns:1fr}.course{min-height:106px;padding:16px}.course-name{font-size:16px}.course .mark{width:42px;height:42px;flex-basis:42px}.card{padding:16px 0}.section-top h1{font-size:20px}}

#authModal{display:none;position:fixed;inset:0;background:#061a36aa;z-index:5;align-items:center;justify-content:center;padding:20px}
#authModal.open{display:flex}.authBox{width:min(430px,100%);background:#fff;border-radius:18px;padding:27px;box-shadow:0 30px 55px #0002}.authBox h2{margin-top:0;font-size:21px}.authBox input{width:100%;padding:14px;border:1px solid #cbd7e8;border-radius:10px;margin:10px 0 14px}.primary{background:#1957b3;color:white;border:0;border-radius:9px;padding:12px 18px;cursor:pointer}.secondary{background:#eaf0f8;color:#244369;border:0;border-radius:9px;padding:12px 18px;cursor:pointer}.authBox .error{font-size:13px;min-height:22px;margin-top:8px}.studentRoom{margin-top:20px}.studentRoom.hidden{display:none}.roomBar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:15px 0}.roomBar h2{margin:0;font-size:22px}.videoList{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:16px}.lecture{border:1px solid #dce6f2;background:white;border-radius:15px;padding:0;overflow:hidden;text-align:left;cursor:pointer}.lecture:disabled{cursor:default;opacity:.7}.thumb{height:128px;background:linear-gradient(125deg,#163c78,#3773c2);display:flex;justify-content:center;align-items:center;color:#fff}.thumb span{font-size:23px;font-weight:700}.lectureContent{padding:15px}.lectureContent strong{font-size:15px;line-height:1.5}.lectureContent small{display:block;color:#73849c;margin-top:6px}.playerBackdrop{position:fixed;inset:0;background:#06152ae8;z-index:8;display:none;justify-content:center;align-items:center;padding:16px}.playerBackdrop.open{display:flex}.playerCard{max-width:950px;width:100%;background:#fff;border-radius:16px;padding:18px}.videoStage{position:relative;width:100%;aspect-ratio:16/9;background:#081225;overflow:hidden}.videoStage iframe{width:100%;height:100%;border:0}.watermark{pointer-events:none;position:absolute;inset:0;z-index:3;overflow:hidden;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));align-items:center;justify-items:center;gap:8px}.watermark span{font-weight:800;font-size:clamp(16px,2.15vw,27px);color:rgba(255,255,255,.30);transform:rotate(-20deg);white-space:nowrap;max-width:100%;overflow:hidden;text-shadow:0 1px 3px #000b}.videoTop{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.videoTop h2{font-size:18px;margin:0}@media(max-width:650px){.thumb{height:115px}.watermark{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}.watermark span{font-size:clamp(12px,2.9vw,19px)}.roomBar h2{font-size:18px}}

/* Google Drive 외부창 버튼 차단 + 사이트 내부 전체화면 */
.thumb{position:relative;overflow:hidden}
.thumb img{display:block;width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.thumb.hasPreview{background:#102b56}
.thumb.hasPreview:after{content:'▶';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;place-items:center;width:45px;height:45px;border-radius:50%;background:#07172eaa;color:#fff;font-size:18px;box-shadow:0 2px 8px #0005;pointer-events:none}
.thumb.hasPreview span{position:absolute;top:9px;left:10px;z-index:1;font-size:12px;border-radius:6px;padding:4px 7px;background:#091d3fb8;color:#fff}

.playerActions{display:flex;align-items:center;gap:8px}
.driveExternalShield{position:absolute;top:0;right:0;width:85px;height:52px;z-index:4;background:transparent;cursor:default}
.playerCard:fullscreen{max-width:none;width:100%;height:100%;border-radius:0;display:flex;flex-direction:column;padding:12px;background:#0a1020;color:#fff}
.playerCard:fullscreen .videoStage{flex:1;min-height:0;aspect-ratio:auto}
.playerCard:fullscreen .videoTop{flex:0 0 auto}
.playerCard:fullscreen .muted{color:#d2daeb}
@media(max-width:650px){.driveExternalShield{width:65px;height:44px}}
</style></head>
<body>
<header><strong class="logo">AIX</strong><div><div class="site-title">SBS아카데미AIX학원 부산점</div><div class="eyebrow">ONLINE LEARNING CENTER</div></div></header>
<main><section class="hero" aria-label="수업의 연장선, 언제 어디서나 이어지는 배움"><picture><source media="(max-width:650px)" srcset="assets/banner-mobile.webp"><img src="assets/banner-desktop.webp" alt="수업의 연장선, 언제 어디서나 이어지는 배움 — 교실을 넘어 배움은 일상 속에서 계속됩니다"></picture></section>
<section class="card" aria-labelledby="courseTitle" id="catalog"><div class="section-top"><div><h1 id="courseTitle">전체 교육과정</h1><p class="muted">수강 중인 과정을 찾아 선택해 주세요.</p></div><label class="search"><span aria-hidden="true">⌕</span><input id="courseSearch" type="search" placeholder="과목명 검색" aria-label="교육과정 검색"></label></div>
<p class="course-count" id="status" role="status">강의 목록을 불러오고 있습니다.</p><div id="courses" class="grid"></div></section><section class="studentRoom hidden" id="room"><div class="roomBar"><div><h2 id="roomTitle">강의실</h2><p class="muted">영상은 각 공개일부터 7일간 시청할 수 있습니다.</p></div><button id="leaveRoom" class="secondary">전체 교육과정</button></div><p id="roomStatus" class="course-count">강의를 불러오는 중입니다.</p><div id="videoList" class="videoList"></div></section></main>
<footer><span>© SBS아카데미AIX학원 부산점</span><a href="admin.html">관리자</a></footer>
<div id="authModal" role="dialog" aria-modal="true" aria-labelledby="authTitle"><div class="authBox"><h2 id="authTitle">강의실 입장</h2><p class="muted">담당자에게 안내받은 수강 비밀번호를 입력해 주세요.</p><input type="password" id="studentPassword" placeholder="비밀번호" autocomplete="off"><div style="display:flex;gap:9px"><button class="primary" id="unlock">강의실 입장</button><button class="secondary" id="closeAuth">취소</button></div><p class="error" id="authError" role="alert"></p></div></div>
<div id="player" class="playerBackdrop" role="dialog" aria-modal="true"><div class="playerCard"><div class="videoTop"><h2 id="playTitle">강의 영상</h2><div class="playerActions"><button class="secondary" id="expandPlayer" type="button">전체화면</button><button class="secondary" id="closePlayer">닫기</button></div></div><div class="videoStage"><iframe id="videoFrame" title="강의 재생" referrerpolicy="strict-origin-when-cross-origin" sandbox="allow-scripts allow-same-origin allow-forms" allow="autoplay; encrypted-media"></iframe><div class="driveExternalShield" aria-hidden="true"></div><div id="wm" class="watermark"></div></div><p class="muted" style="font-size:12px;margin:12px 0 0">교육용 영상입니다. 무단 복제 및 배포를 금지합니다.</p></div></div>
<script src="config.js"></script><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const $=id=>document.getElementById(id),c=window.AIX_CONFIG;
const db=createClient(c.SUPABASE_URL,c.SUPABASE_PUBLISHABLE_KEY);
let courses=[],selected=null,token=null;
const icon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5h6a3 3 0 0 1 3 3v11a3 3 0 0 0-3-3H4zM20 5.5h-4a3 3 0 0 0-3 3v11a3 3 0 0 1 3-3h4z"/></svg>';
function render(q=''){const filtered=courses.filter(x=>(x.course_title+' '+x.course_description).toLowerCase().includes(q.trim().toLowerCase()));$('courses').replaceChildren();$('status').textContent=q?`검색 결과 ${filtered.length}개 교육과정`:`총 ${courses.length}개 교육과정`;
 for(const item of filtered){const btn=document.createElement('button');btn.className='course';const mark=document.createElement('span');mark.className='mark';mark.innerHTML=icon;const body=document.createElement('span');body.className='course-body';const name=document.createElement('span');name.className='course-name';name.textContent=item.course_title;const desc=document.createElement('span');desc.className='course-desc';desc.textContent=item.course_description||'온라인 교육과정';const enter=document.createElement('span');enter.className='course-enter';enter.textContent='강의실 입장';const arrow=document.createElement('span');arrow.className='course-arrow';arrow.textContent='›';body.append(name,desc,enter);btn.append(mark,body,arrow);btn.onclick=()=>{selected=item;$('authTitle').textContent=item.course_title+' · 강의실 입장';$('studentPassword').value='';$('authError').textContent='';$('authModal').classList.add('open');$('studentPassword').focus()};$('courses').append(btn)}
 if(!filtered.length){const x=document.createElement('p');x.className='empty';x.textContent='검색 결과가 없습니다.';$('courses').append(x)}}
$('courseSearch').oninput=e=>render(e.target.value);
$('closeAuth').onclick=()=>$('authModal').classList.remove('open');
$('studentPassword').onkeydown=e=>{if(e.key==='Enter')$('unlock').click()};
$('unlock').onclick=async()=>{const pw=$('studentPassword').value.trim();if(!pw){$('authError').textContent='비밀번호를 입력해 주세요';return}const b=$('unlock');b.disabled=true;try{const r=await db.rpc('aix_student_unlock',{p_course:selected.course_id,p_password:pw});if(r.error)throw r.error;token=r.data;$('studentPassword').value='';$('authModal').classList.remove('open');$('catalog').style.display='none';$('room').classList.remove('hidden');$('roomTitle').textContent=selected.course_title;await loadVideos()}catch(e){$('authError').textContent=e?.message||'입장에 실패했습니다'}finally{b.disabled=false}};
const time=t=>new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(t));
// 썸네일은 공개 중인 강의에만 서버의 시청 권한 검사 후 요청합니다.
// Drive 쪽에서 미리보기 이미지를 제공하지 않는 경우 강의 번호를 유지합니다.
async function fetchLecturePreview(number,thumb,btn){
 try{
  const {data,error}=await db.rpc('aix_student_play',{p_token:token,p_lesson:number});
  if(error||!data?.length||!thumb.isConnected||btn.disabled)return;
  const file=String(data[0].drive_file_id||'');
  if(!/^[a-zA-Z0-9_-]{15,}$/.test(file))return;
  const img=document.createElement('img');
  img.alt=number+'강 영상 미리보기';img.loading='lazy';img.decoding='async';img.referrerPolicy='no-referrer';
  img.onload=()=>{if(thumb.isConnected){thumb.prepend(img);thumb.classList.add('hasPreview')}};
  img.onerror=()=>{img.remove()};
  img.src='https://drive.google.com/thumbnail?id='+encodeURIComponent(file)+'&sz=w640';
 }catch(e){/* 미리보기 실패해도 강의 접근에는 영향 없음 */}
}

async function loadVideos(){const {data,error}=await db.rpc('aix_student_lessons',{p_token:token});const root=$('videoList');root.replaceChildren();if(error){$('roomStatus').textContent='강의 목록 조회 실패: '+error.message;return}$('roomStatus').textContent=`총 ${(data||[]).length}개 영상 · 한국시간 00:00 공개`;for(const v of (data||[])){const btn=document.createElement('button');btn.className='lecture';btn.disabled=!v.available;const thumb=document.createElement('div');thumb.className='thumb';const label=document.createElement('span');label.textContent=String(v.lesson_number).padStart(2,'0')+'강';thumb.append(label);const body=document.createElement('div');body.className='lectureContent';const title=document.createElement('strong');title.textContent=v.title;const sub=document.createElement('small');sub.textContent=v.available?'시청 가능 · '+time(v.expires_at)+' 종료':new Date(v.release_at)>new Date()?'공개 예정 · '+time(v.release_at):'시청 기간 종료';body.append(title,sub);btn.append(thumb,body);if(v.available)btn.onclick=()=>playVideo(v.lesson_number);root.append(btn);if(v.available)fetchLecturePreview(v.lesson_number,thumb,btn)}if(!data?.length){$('roomStatus').textContent='등록된 영상 일정이 없습니다.'}}
async function playVideo(number){const {data,error}=await db.rpc('aix_student_play',{p_token:token,p_lesson:number});if(error||!data?.length){alert('시청 기간이 종료되었거나 접근 권한이 없습니다.');await loadVideos();return}const item=data[0];$('playTitle').textContent=item.lesson_title;const file=String(item.drive_file_id||'');if(!/^[a-zA-Z0-9_-]{15,}$/.test(file)){alert('영상 링크 형식을 확인해 주세요.');return}$('videoFrame').src='https://drive.google.com/file/d/'+encodeURIComponent(file)+'/preview';$('wm').replaceChildren();for(let i=0;i<6;i++){const s=document.createElement('span');s.textContent=item.watermark||'SBS아카데미AIX학원 부산점 · 무단 배포 금지';$('wm').append(s)}$('player').classList.add('open')}
$('expandPlayer').onclick=async()=>{const card=document.querySelector('.playerCard');try{if(document.fullscreenElement){await document.exitFullscreen()}else if(card.requestFullscreen){await card.requestFullscreen()}else{alert('이 브라우저는 사이트 전체화면을 지원하지 않습니다.')}}catch(e){alert('전체화면을 실행할 수 없습니다. 브라우저 설정을 확인해 주세요.')}};
document.addEventListener('fullscreenchange',()=>{$('expandPlayer').textContent=document.fullscreenElement?'전체화면 종료':'전체화면'});
$('closePlayer').onclick=async()=>{if(document.fullscreenElement){try{await document.exitFullscreen()}catch(e){}}$('player').classList.remove('open');$('videoFrame').src='about:blank'};
$('leaveRoom').onclick=()=>{token=null;$('room').classList.add('hidden');$('catalog').style.display='block';$('videoList').replaceChildren()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('closePlayer').click();$('authModal').classList.remove('open')}});
try{const {data,error}=await db.rpc('list_aix_courses');if(error)throw error;courses=data||[];if(courses.length)render();else $('status').textContent='현재 등록된 교육과정이 없습니다.'}catch(e){$('status').textContent='교육과정 조회 오류: '+e.message;$('status').classList.add('error')}
</script></body></html>
