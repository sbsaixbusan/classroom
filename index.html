ll.live strong{color:#16754c}.course b{display:block}

-size:clamp(16px,2.15vw,27px);color:rgba(255,255,255,.30);transform:rotate(-20deg);white-space:nowrap;max-width:100%;overflow:hidden;text-shadow:0 1px 3px #000b}.videoTop{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.videoTop h2{font-size:18px;margin:0}@media(max-width:650px){.thumb{height:115px}.watermark{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}.watermark span{font-size:clamp(12px,2.9vw,19px)}.roomBar h2{font-size:18px}}

.thumb{position:relative;overflow:hidden;isolation:isolate;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(128deg,#173a71 0%,#2356a0 53%,#387ac5 100%);}
.thumb::before{content:"";position:absolute;width:245px;height:245px;border:1px solid rgba(255,255,255,.22);
  border-radius:50%;right:-80px;top:-138px;box-shadow:0 0 0 38px rgba(255,255,255,.045),0 0 0 78px rgba(255,255,255,.025);}
.thumb::after{content:"";position:absolute;inset:16px;border:1px solid rgba(255,255,255,.19);border-radius:8px;pointer-events:none;}
.thumb span{position:relative;z-index:2;font-size:31px;letter-spacing:-.055em;font-weight:850;
 color:#fff;text-shadow:0 2px 8px rgba(4,22,60,.24);}
.thumb span::before{content:"ONLINE CLASS";display:block;margin-bottom:7px;font-size:10px;letter-spacing:.22em;
 font-weight:650;color:rgba(255,255,255,.76);text-align:center;}
.lecture:nth-child(4n+2) .thumb{background:linear-gradient(132deg,#274979,#416c9e 58%,#5f88b5)}
.lecture:nth-child(4n+3) .thumb{background:linear-gradient(132deg,#294d83,#467bb7 60%,#739cd0)}
.lecture:nth-child(4n+4) .thumb{background:linear-gradient(132deg,#32557f,#4d80b8 60%,#6792c4)}

.lecture:not(:disabled){transition:transform .18s,box-shadow .18s,border-color .18s}

.lecture:disabled .lectureContent{background:#fbfcfe}

<body>
<header><a class="homeBrand" href="./" id="homeBrand" aria-label="SBS아카데미AIX학원 부산점 홈으로"><strong class="logo">AIX</strong><span class="brandText"><span class="site-title">SBS아카데미AIX학원 부산점</span><span class="eyebrow">ONLINE LEARNING CENTER</span></span></a></header>
<main><section class="hero" aria-label="수업의 연장선, 언제 어디서나 이어지는 배움"><picture><source media="(max-width:650px)" srcset="assets/banner-mobile.webp"><img src="assets/banner-desktop.webp" alt="수업의 연장선, 언제 어디서나 이어지는 배움 — 교실을 넘어 배움은 일상 속에서 계속됩니다"></picture></section>
<section class="card" aria-labelledby="courseTitle" id="catalog"><div class="section-top"><div><h1 id="courseTitle">전체 교육과정</h1><p class="muted">수강 중인 과정을 찾아 선택해 주세요.</p></div><label class="search"><span aria-hidden="true">⌕</span><input id="courseSearch" type="search" placeholder="과목명 검색" aria-label="교육과정 검색"></label></div>
<div class="course-overview" id="courseOverview" aria-live="polite" style="display:none"></div><p class="course-count" id="status" role="status">강의 목록을 불러오고 있습니다.</p><div id="courses" class="grid"></div></section><section class="studentRoom hidden" id="room"><div class="roomBar"><div><h2 id="roomTitle">강의실</h2><p class="muted">영상은 각 공개일부터 7일간 시청할 수 있습니다.</p></div><button id="leaveRoom" class="secondary">전체 교육과정</button></div><p id="roomStatus" class="course-count">강의를 불러오는 중입니다.</p><div id="videoList" class="videoList"></div></section></main>
<footer><span>© SBS아카데미AIX학원 부산점</span><a href="admin.html">관리자</a></footer>
<div id="authModal" role="dialog" aria-modal="true" aria-labelledby="authTitle"><div class="authBox"><h2 id="authTitle">강의실 입장</h2><p class="muted">담당자에게 안내받은 수강 비밀번호를 입력해 주세요.</p><input type="password" id="studentPassword" placeholder="비밀번호" autocomplete="off"><div style="display:flex;gap:9px"><button class="primary" id="unlock">강의실 입장</button><button class="secondary" id="closeAuth">취소</button></div><p class="error" id="authError" role="alert"></p></div></div>
<div id="player" class="playerBackdrop" role="dialog" aria-modal="true"><div class="playerCard"><div class="videoTop"><h2 id="playTitle">강의 영상</h2><div class="playerActions"><button class="secondary" id="expandPlayer" type="button">전체화면</button><button class="secondary" id="closePlayer">닫기</button></div></div><div class="videoStage"><iframe id="videoFrame" title="강의 재생" referrerpolicy="strict-origin-when-cross-origin" sandbox="allow-scripts allow-same-origin allow-forms" allow="autoplay; encrypted-media"></iframe><div class="driveExternalShield" aria-hidden="true"></div><div id="wm" class="watermark"></div></div><p class="muted" style="font-size:12px;margin:12px 0 0">교육용 영상입니다. 무단 복제 및 배포를 금지합니다.</p></div></div>
<script src="config.js"></script><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const $=id=>document.getElementById(id),c=window.AIX_CONFIG;
const db=createClient(c.SUPABASE_URL,c.SUPABASE_PUBLISHABLE_KEY);
let courses=[],selected=null,token=null,courseStats=new Map(),courseLabels=new Map(),statsLoaded=false;
const icon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5h6a3 3 0 0 1 3 3v11a3 3 0 0 0-3-3H4zM20 5.5h-4a3 3 0 0 0-3 3v11a3 3 0 0 1 3-3h4z"/></svg>';
function render(q=''){
 const filtered=courses.filter(x=>(x.course_title+' '+x.course_description).toLowerCase().includes(q.trim().toLowerCase()));
 $('courses').replaceChildren();
 const openCourses=courses.filter(x=>(courseStats.get(x.course_id)?.open_lessons||0)>0).length;
 const overview=$('courseOverview');overview.replaceChildren();overview.style.display='flex';
 const totalPill=document.createElement('span');totalPill.className='overview-pill';totalPill.append('전체 과목 ',Object.assign(document.createElement('strong'),{textContent:String(courses.length)}),'개');overview.append(totalPill);
 const openPill=document.createElement('span');openPill.className='overview-pill live';openPill.append('현재 오픈 ',Object.assign(document.createElement('strong'),{textContent:statsLoaded?String(openCourses):'확인 중'}),statsLoaded?'개 과목':'');overview.append(openPill);
 $('status').textContent=q?`검색 결과 ${filtered.length}개 과목`:`전체 ${courses.length}개 과목 중 ${statsLoaded?openCourses+'개 과목 오픈':'오픈 현황 확인 중'}`;
 for(const item of filtered){
  const btn=document.createElement('button');btn.className='course';
  const mark=document.createElement('span');mark.className='mark';mark.innerHTML=icon;
  const body=document.createElement('span');body.className='course-body';
  const name=document.createElement('span');name.className='course-name';name.textContent=item.course_title;
  const kind=document.createElement('span');kind.className='course-kind';kind.textContent='수업 구분 · '+(courseLabels.get(item.course_id)||'미등록');
  const desc=document.createElement('span');desc.className='course-desc';if(item.course_description)desc.textContent=item.course_description;
  const stat=document.createElement('span');stat.className='course-stats';
  const info=courseStats.get(item.course_id);
  const totalTag=document.createElement('span');totalTag.className='stat-tag';totalTag.textContent=statsLoaded?`전체 ${info?.total_lessons||0}강`:'강의 수 확인 중';stat.append(totalTag);
  if(statsLoaded){const liveTag=document.createElement('span');const n=info?.open_lessons||0;liveTag.className='stat-tag'+(n?' live':'');liveTag.textContent=n?`현재 ${n}강 공개`:'공개 중인 강의 없음';stat.append(liveTag)}
  const enter=document.createElement('span');enter.className='course-enter';enter.textContent='강의실 입장';
  const arrow=document.createElement('span');arrow.className='course-arrow';arrow.textContent='›';
  body.append(name,kind);if(item.course_description)body.append(desc);body.append(stat,enter);btn.append(mark,body,arrow);
  btn.onclick=()=>{selected=item;$('authTitle').textContent=item.course_title+' · 강의실 입장';$('studentPassword').value='';$('authError').textContent='';$('authModal').classList.add('open');$('studentPassword').focus()};$('courses').append(btn)
 }
 if(!filtered.length){const x=document.createElement('p');x.className='empty';x.textContent='검색 결과가 없습니다.';$('courses').append(x)}
}
$('courseSearch').oninput=e=>render(e.target.value);
$('closeAuth').onclick=()=>$('authModal').classList.remove('open');
$('studentPassword').onkeydown=e=>{if(e.key==='Enter')$('unlock').click()};
$('unlock').onclick=async()=>{const pw=$('studentPassword').value.trim();if(!pw){$('authError').textContent='비밀번호를 입력해 주세요';return}const b=$('unlock');b.disabled=true;try{const r=await db.rpc('aix_student_unlock',{p_course:selected.course_id,p_password:pw});if(r.error)throw r.error;token=r.data;$('studentPassword').value='';$('authModal').classList.remove('open');$('catalog').style.display='none';$('room').classList.remove('hidden');$('roomTitle').textContent=selected.course_title;await loadVideos()}catch(e){$('authError').textContent=e?.message||'입장에 실패했습니다'}finally{b.disabled=false}};
const time=t=>new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(t));
async function loadVideos(){const {data,error}=await db.rpc('aix_student_lessons',{p_token:token});const root=$('videoList');root.replaceChildren();if(error){$('roomStatus').textContent='강의 목록 조회 실패: '+error.message;return}$('roomStatus').textContent=`총 ${(data||[]).length}개 영상 · 한국시간 00:00 공개`;for(const v of (data||[])){const btn=document.createElement('button');btn.className='lecture';btn.disabled=!v.available;const thumb=document.createElement('div');thumb.className='thumb';thumb.setAttribute('aria-hidden','true');const label=document.createElement('span');label.textContent=String(v.lesson_number).padStart(2,'0')+'강';thumb.append(label);const body=document.createElement('div');body.className='lectureContent';const title=document.createElement('strong');title.textContent=v.title;const sub=document.createElement('small');sub.textContent=v.available?'시청 가능 · '+time(v.expires_at)+' 종료':new Date(v.release_at)>new Date()?'공개 예정 · '+time(v.release_at):'시청 기간 종료';body.append(title,sub);btn.append(thumb,body);if(v.available)btn.onclick=()=>playVideo(v.lesson_number);root.append(btn);}if(!data?.length){$('roomStatus').textContent='등록된 영상 일정이 없습니다.'}}
async function playVideo(number){const {data,error}=await db.rpc('aix_student_play',{p_token:token,p_lesson:number});if(error||!data?.length){alert('시청 기간이 종료되었거나 접근 권한이 없습니다.');await loadVideos();return}const item=data[0];$('playTitle').textContent=item.lesson_title;const file=String(item.drive_file_id||'');if(!/^[a-zA-Z0-9_-]{15,}$/.test(file)){alert('영상 링크 형식을 확인해 주세요.');return}$('videoFrame').src='https://drive.google.com/file/d/'+encodeURIComponent(file)+'/preview';$('wm').replaceChildren();for(let i=0;i<6;i++){const s=document.createElement('span');s.textContent=item.watermark||'SBS아카데미AIX학원 부산점 · 무단 배포 금지';$('wm').append(s)}$('player').classList.add('open')}
$('expandPlayer').onclick=async()=>{const card=document.querySelector('.playerCard');try{if(document.fullscreenElement){await document.exitFullscreen()}else if(card.requestFullscreen){await card.requestFullscreen()}else{alert('이 브라우저는 사이트 전체화면을 지원하지 않습니다.')}}catch(e){alert('전체화면을 실행할 수 없습니다. 브라우저 설정을 확인해 주세요.')}};
document.addEventListener('fullscreenchange',()=>{$('expandPlayer').textContent=document.fullscreenElement?'전체화면 종료':'전체화면'});
$('closePlayer').onclick=async()=>{if(document.fullscreenElement){try{await document.exitFullscreen()}catch(e){}}$('player').classList.remove('open');$('videoFrame').src='about:blank'};
$('leaveRoom').onclick=()=>{token=null;$('room').classList.add('hidden');$('catalog').style.display='block';$('videoList').replaceChildren()};
$('homeBrand').addEventListener('click',async e=>{
 e.preventDefault();
 $('authModal').classList.remove('open');
 if(document.fullscreenElement){try{await document.exitFullscreen()}catch(err){}}
 $('player').classList.remove('open');$('videoFrame').src='about:blank';
 token=null;selected=null;
 $('room').classList.add('hidden');$('catalog').style.display='block';
 $('videoList').replaceChildren();$('studentPassword').value='';
 $('courseSearch').value='';render();window.scrollTo({top:0,behavior:'smooth'});
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('closePlayer').click();$('authModal').classList.remove('open')}});
try{const {data,error}=await db.rpc('list_aix_courses');if(error)throw error;courses=data||[];if(courses.length){render();const r=await db.rpc('list_aix_course_status');if(r.error){console.warn('과목 공개 현황 조회 실패:',r.error.message);$('status').textContent='과목별 공개 현황을 불러오지 못했습니다. Supabase 조회 함수 설치를 확인해 주세요.';$('status').classList.add('error')}else{courseStats=new Map((r.data||[]).map(x=>[x.course_id,{total_lessons:Number(x.total_lessons)||0,open_lessons:Number(x.open_lessons)||0}]));statsLoaded=true;const lbl=await db.rpc('list_aix_course_labels');if(lbl.error){console.warn('수업 구분 조회 실패:',lbl.error.message)}else{courseLabels=new Map((lbl.data||[]).map(x=>[x.course_id,x.class_label]))}render($('courseSearch').value)}}else $('status').textContent='현재 등록된 교육과정이 없습니다.'}catch(e){$('status').textContent='교육과정 조회 오류: '+e.message;$('status').classList.add('error')}
</script></body></html>
